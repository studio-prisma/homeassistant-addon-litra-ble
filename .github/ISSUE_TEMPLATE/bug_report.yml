name: Bug report
description: The add-on or bridge misbehaves with a light it is meant to support.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: "0.4.2"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Light model
      options:
        - Litra Beam
        - Litra Beam LX
        - Litra Glow
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options:
        - Bluetooth
        - USB
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Home Assistant host and Bluetooth adapter
      placeholder: "Raspberry Pi 4, built-in Bluetooth, HA OS 18.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Add-on log
      description: From the add-on's Log tab. Replace Bluetooth addresses if you prefer.
      render: text
    validations:
      required: true
