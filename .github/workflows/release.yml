name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.3). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      # The add-on manifest is the version Home Assistant shows and builds. The
      # Python package and both changelogs have to agree with it, or the release
      # stops here.
      - name: Verify versions match the tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          ADDON=$(grep -oP '^version:\s*"\K[^"]+' litra_ble_bridge/config.yaml)
          PACKAGE=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          for pair in "config.yaml:$ADDON" "pyproject.toml:$PACKAGE"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} declares '${pair#*:}' but the tag is '$VERSION'."
              exit 1
            fi
          done
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$VERSION] section."; exit 1; }
          grep -q "^## $VERSION$" litra_ble_bridge/CHANGELOG.md || { echo "::error::litra_ble_bridge/CHANGELOG.md has no $VERSION section."; exit 1; }
          echo "Version $VERSION confirmed."

      - name: Extract CHANGELOG section for this version
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # No build artefact: Home Assistant builds the add-on image itself from the
      # tagged sources when the repository is added as an add-on repository.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
